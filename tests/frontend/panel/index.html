<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hue dashboard panel, test page</title>
</head>
<body>
<hue-plus-panel id="panel"></hue-plus-panel>
<script type="module">
  /* Serve the repository root (python3 -m http.server 8777) and open /tests/frontend/panel/index.html. ?user=guest makes the user not an administrator. */
  import { makeHass } from "./mock-hass.js";
  await import("/custom_components/hue_plus/frontend/panel.js?v=test");
  document.getElementById("panel").hass = makeHass(new URLSearchParams(location.search));
</script>
</body>
</html>
