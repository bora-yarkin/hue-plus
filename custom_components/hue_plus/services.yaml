      required: true
      selector:
        select:
          options: ["wake_up", "go_to_sleep", "timer", "schedule", "coming_home", "leaving_home", "smoke_alarm"]
    "name":
      required: true
      selector:
        text: {}
    "group":
      required: true
      selector:
        text: {}
    "group_type":
      default: "room"
      selector:
        select:
          options: ["room", "zone"]
    "time":
      selector:
        time: {}
    "until":
      selector:
        time: {}
    "days":
      selector:
        select:
          options: ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
          multiple: true
    "minutes":
      selector:
        number:
          mode: "box"
          step: "any"
    "end_brightness":
      default: 100
      selector:
        number:
          mode: "box"
          step: "any"
    "scene":
      selector:
        text: {}
    "enabled":
      default: true
      selector:
        boolean: {}

configure_button:
  fields:
    "accessory":
      required: true
      example: "Hue dimmer switch 1"
      selector:
        text: {}
    "button":
      required: true
      selector:
        number:
          mode: "box"
          min: 1
          max: 8
          step: 1
    "press":
      required: true
      selector:
        select:
          options: ["short", "long", "repeat"]
    "action":
      required: true
      selector:
        select:
          options: ["dim_up", "dim_down", "all_off", "home_off", "do_nothing", "scene", "scene_cycle", "time_based"]
    "scene":
      selector:
        text: {}
    "scenes":
      selector:
        object: {}
    "slots":
      selector:
        object: {}
    "repeat_timeout":
      selector:
        number:
          mode: "box"
          min: 1
          max: 10
          step: 1
    "with_off":
      default: false
      selector:
        boolean: {}

create_daily_smart_scene:
  fields:
    "name":
      required: true
      selector:
        text: {}
    "group":
      required: true
      selector:
        text: {}
    "group_type":
      default: "room"
      selector:
        select:
          options: ["room", "zone"]
    "slots":
      required: true
      selector:
        object: {}
    "days":
      selector:
        select:
          options: ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
          multiple: true

light_step:
  fields:
    "lights":
      required: true
      selector:
        object: {}
    "brightness_step":
      selector:
        number:
          mode: "box"
          step: "any"
    "mirek_step":
      selector:
        number:
          mode: "box"
          min: -347
          max: 347
          step: 1

configure_sensor:
  fields:
    "sensor":
      required: true
      selector:
        text: {}
    "enabled":
      selector:
        boolean: {}
    "sensitivity":
      selector:
        number:
          mode: "box"
          min: 0
          max: 10
          step: 1

remove_matter_fabric:
  fields:
    "fabric":
      required: true
      selector:
        text: {}
    "confirm":
      required: true
      selector:
        boolean: {}

raw_request:
  fields:
    "resource":
      required: true
      selector:
        select:
          options: ["light", "grouped_light", "scene", "smart_scene", "room", "zone", "device", "behavior_instance", "entertainment_configuration", "matter", "matter_fabric", "bridge", "button", "relative_rotary", "motion", "geofence_client", "geolocation", "motion_area_candidate", "motion_area_configuration", "clip", "sonos", "device_power", "light_level", "temperature", "contact", "tamper"]
    "id":
      selector:
        text: {}
    "method":
      default: "GET"
      selector:
        select:
          options: ["GET", "PUT", "POST", "DELETE"]
    "body":
      selector:
        object: {}
    "confirm":
      selector:
        boolean: {}

set_style:
  fields:
    "light":
      required: true
      example: "light.bed_light_zones"
      selector:
        text: {}
    "style":
      selector:
        select:
          options: ["linear", "mirrored", "scattered", "segmented"]
    "flip":
      default: false
      selector:
        boolean: {}

set_effect:
  fields:
    "lights":
      required: true
      selector:
        object: {}
    "effect":
      required: true
      selector:
        text: {}
    "hs_color":
      example: "[30, 80]"
      selector:
        object: {}
    "kelvin":
      selector:
        number:
          mode: "box"
          step: "any"
    "speed":
      selector:
        number:
          mode: "box"
          step: "any"

set_gradient:
  fields:
    "light":
      required: true
      example: "light.bed_light_zones"
      selector:
        text: {}
    "points":
      required: true
      example: "[[0.7, 0.3], [0.2, 0.2]]"
      selector:
        object: {}
    "mode":
      selector:
        text: {}

import_hue_scene:
  fields:
    "entity_id":
      required: true
      example: "scene.bedroom_arctic_aurora"
      selector:
        text: {}

stream_colors:
  fields:
    "area":
      required: true
      example: "TV"
      selector:
        text: {}
    "colors":
      required: true
      example: "[[255, 0, 0], [0, 0, 255]]"
      selector:
        object: {}
    "duration":
      default: 10
      selector:
        number:
          mode: "box"
          step: "any"

stop_streaming:
  fields:
    "area":
      selector:
        text: {}

activate_scene:
  target:
    entity:
      integration: "hue_plus"
      domain: "scene"
  fields:
    "dynamic":
      default: false
      selector:
        boolean: {}
    "speed":
      selector:
        number:
          mode: "box"
          min: 0
          max: 100
          step: 1
    "brightness":
      selector:
        number:
          mode: "box"
          min: 1
          max: 255
          step: 1
    "transition":
      selector:
        number:
          mode: "box"
          step: "any"

play_effect:
  target:
    entity:
      integration: "hue_plus"
      domain: "light"
  fields:
    "effect":
      required: true
      selector:
        select:
          options: ["candle", "fire", "sparkle", "glisten", "opal", "prism", "underwater", "cosmos", "sunbeam", "enchant"]
    "xy":
      required: true
      example: "[0.35, 0.3]"
      selector:
        object: {}
    "brightness":
      required: true
      selector:
        number:
          mode: "box"
          min: 1
          max: 255
          step: 1
    "speed":
      required: true
      selector:
        number:
          mode: "box"
          step: "any"
