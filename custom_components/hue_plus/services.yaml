get_resources:
  fields:
    "kinds":
      selector:
        select:
          options: ["apps", "automations", "automation_templates", "rooms", "zones", "scenes", "smart_scenes", "entertainment_areas", "matter_fabrics", "accessories", "home_and_away", "motion_sensors", "motion_areas", "supported_resources", "devices", "firmware", "bridge"]
          multiple: true

timed_effect:
  fields:
    "light":
      required: true
      example: "Floor Light L"
      selector:
        text: {}
    "effect":
      required: true
      selector:
        select:
          options: ["sunrise", "sunset", "no_effect"]
    "duration":
      example: 900
      selector:
        number:
          mode: "box"
          step: "any"

signal:
  fields:
    "light":
      required: true
      example: "Floor Light L"
      selector:
        text: {}
    "signal":
      required: true
      selector:
        select:
          options: ["on_off", "on_off_color", "alternating", "no_signal"]
    "duration":
      default: 5
      selector:
        number:
          mode: "box"
          step: "any"
    "colors_xy":
      example: "[[0.7, 0.3], [0.2, 0.2]]"
      selector:
        object: {}

set_power_on:
  fields:
    "light":
      required: true
      example: "Floor Light L"
      selector:
        text: {}
    "preset":
      required: true
      selector:
        select:
          options: ["safety", "powerfail", "last_on_state", "custom"]
    "on":
      selector:
        select:
          options: ["on", "toggle", "previous"]
    "brightness":
      selector:
        number:
          mode: "box"
          step: "any"
    "color_temperature_kelvin":
      selector:
        number:
          mode: "box"
          step: "any"
    "color_xy":
      selector:
        object: {}

