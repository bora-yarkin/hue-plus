<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hue light</title>
<link rel="stylesheet" href="lights/dashboard.css">
<style>
html{background:transparent!important}
body{background:transparent!important;overflow:hidden;opacity:0}
body.rise{opacity:1}
/* As the Hue app moves it (read frame by frame from a screen recording): the wheel drops in from the top, the mode buttons and the brightness button drop further, over the same short time, and the tiles of the lights slide down from where the room page had them. */
body.rise .lp-view{animation:lpwheel .42s cubic-bezier(.2,.8,.2,1) backwards}
body.rise .lp-bar{animation:lpchips .42s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes lpwheel{from{transform:translateY(-68vh)}to{transform:none}}
@keyframes lpchips{from{transform:translateY(-58vh);opacity:0}to{transform:none;opacity:1}}
/* Colour, white and effects follow each other by fading, not by sliding across the screen */
.lp-track{transition:none!important}
.lp-pane:not(.off){animation:lpfade .3s ease-out}
@keyframes lpfade{from{opacity:0}to{opacity:1}}
/* The colour screen fills the screen as the app's does: the wheel in the middle of what is left, the modes and the brightness button and the tiles of the lights at the bottom. */
main{position:absolute!important;inset:0;padding:0!important;overflow:hidden}
.wrap{height:100%;max-width:none}
#body{height:100%;display:flex;flex-direction:column;padding:0 16px calc(var(--sab,0px) + 16px)}
.lp-stage{flex:1;display:flex;flex-direction:column;min-height:0}
.lp-view{flex:0 0 auto;margin:auto 0}
/* the effects page uses all the room above the bar, as the app's does */
.lp-view:has(.lp-pane.fx:not(.off)){flex:1 1 0;margin:0;min-height:0;overflow:hidden}
.lp-view:has(.lp-pane.fx:not(.off)) .lp-track,.lp-view:has(.lp-pane.fx:not(.off)) .lp-pane.fx{height:100%}
.lp-bar{margin:0 0 16px}
/* The area editor, as the Hue app draws light placement: a dark page, the Location and Height switch in a dark pill, the room in blue-grey, the lights as pins with glowing heads, and the lights as blue tiles below. */
body.areamode{background:#1b1c20!important}
body.areamode #body{display:block;overflow-y:auto;padding:0 0 calc(var(--sab,0px) + 24px)}
body.areamode .sqw,body.areamode .hint,body.areamode .pill{display:none}
body.areamode #body>.seg{display:flex;gap:0;margin:12px 16px 4px;padding:3px;background:#25262a;border-radius:20px;border:0}
body.areamode .seg .rbtn{flex:1;min-height:0;padding:8px 0;border:0!important;border-radius:17px;background:transparent!important;color:#a3a4aa!important;box-shadow:none!important;font-size:11px;letter-spacing:.06em;text-transform:uppercase;justify-content:center}
body.areamode .seg .rbtn.act{background:#fff!important;color:#1b1c20!important;font-weight:600}
body.areamode .ae-c{margin:0}
body.areamode .ae-wl{fill:#3f3f4d}body.areamode .ae-wr{fill:#4a4a58}body.areamode .ae-fl{fill:#2f3040}
body.areamode .ae-ed{stroke:#5b5b6b}
body.areamode .ae-pole{stroke:#ffffff99;stroke-width:3}
body.areamode .ae-dot{fill:#7fa7ff;stroke:#fff;stroke-width:3}
body.areamode .ae-dot.picked{fill:#fff;stroke:#7fa7ff;stroke-width:5}
body.areamode .ae-tray{gap:10px;padding:12px 16px}
body.areamode .ae-card{width:92px;height:112px;border-radius:14px;border:0;background:linear-gradient(135deg,#3b6fe0,#2a4fa8)!important;color:#fff!important;gap:12px;opacity:.55}
body.areamode .ae-card.in{opacity:1}
body.areamode .ae-card.picked{outline:2.5px solid #fff;outline-offset:-2px}
body.areamode .ae-card svg{width:24px;height:24px}
body.areamode .ae-cn{font-size:12px;font-weight:500}
.lp-tray{padding-bottom:2px}
/* Orientation setup */
.hp-orient{display:none;position:absolute;right:10px;width:36px;height:36px;margin-top:-86px;border:0;border-radius:50%;background:#2d2e33;color:#fff;align-items:center;justify-content:center;cursor:pointer;z-index:3}
.hp-orient.on{display:flex}
.hp-orient svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.hp-osheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#1b1c20;display:flex;flex-direction:column;padding-top:18px;animation:hpo .3s cubic-bezier(.2,.8,.2,1)}
/* while it is open the room stays in view above it, as in the app; the tray and the Location/Height switch give way */
body.orienting .ae-tray,body.orienting .hp-orient,body.orienting #body>.seg{display:none!important}
@keyframes hpo{from{transform:translateY(100%)}to{transform:none}}
.hp-osheet p{margin:0 16px 16px;text-align:center;font-size:14px;font-weight:500}
.hp-ogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px calc(var(--sab,0px) + 20px)}
.hp-ochoice{min-height:64px;border:0;border-radius:12px;background:#2d2e33;color:#fff;font:inherit;font-size:12.5px;cursor:pointer}
.hp-ochoice.on{box-shadow:inset 0 0 0 2px #2e68f7}
/* the pins of the lights glow, as the app draws them */
body.areamode .ae-dot{filter:drop-shadow(0 0 4px rgba(127,167,255,.85))}
/* the picked light's icon in its group's drop, drawn as a single light's is */
.lw-pin .hp-pick{display:contents}
/* The row of lights is the room page's row, moved: the same tiles (size, gaps, look, the gold of a light that is on, the switch) at the same place sideways, so the row that slides here and the
 row the room page shows are one to the eye. */
.lp-tray{gap:11px;margin:0 -16px 0;padding:0 11px;scroll-padding:0 11px}
.lp-tile{flex:0 0 93px;height:146px;border-radius:12px;padding:0 6px 51px;gap:8px;justify-content:center;background:#3a3b3e!important;color:#fff;overflow:hidden;box-shadow:none}
.lp-tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:51px;background:rgba(0,0,0,.14);pointer-events:none}
.lp-tile>svg{width:28px;height:28px;stroke-width:1.8}
.lp-tn{flex:0 0 auto;font-size:12px;font-weight:500;display:block;white-space:nowrap;text-overflow:ellipsis}
.lp-sw{position:absolute;left:50%;bottom:12px;margin-left:-23px;width:46px;height:27px;z-index:1;background:rgba(255,255,255,.2)}
.lp-sw i{left:3px;top:3px;width:21px;height:21px;background:#fff}
.lp-tile.on .lp-sw i{transform:translateX(19px)}
.lp-tile.on,.lp-tile.on.lt{background:linear-gradient(180deg,#fbdb90,#d6ab5b)!important;color:#2a2116;text-shadow:none}
.lp-tile.on .lp-sw,.lp-tile.on.lt .lp-sw{background:rgba(70,52,12,.35)}
.lp-tile.on::after{background:rgba(70,52,12,.16)}
.lp-tile .lp-tfx{display:none!important}
.lp-tile.picked{box-shadow:inset 0 0 0 2.5px #fff}
@supports (corner-shape:squircle){.lp-tile{border-radius:18px;corner-shape:squircle}}
/* never Home Control's large display */
body.lg .wrap{zoom:1!important}
</style>
</head>
<body>
<!-- Home Control's light panel (the colour wheel with the white and effects pages and the brightness button), run as it is: lights/ is a copy of Home Control's dashboard code (scripts/sync_light_popup.py).
 It is a frame of its own, so that its stylesheet and its global names never meet the panel's. The panel (app.js) draws it with HuePopup.panel(ids, name) and gives it Home Assistant's `hass` through
 HuePopup.attach(hass). Nothing is kept in Home Assistant. -->
<main><div class="wrap"><div id="body"></div></div></main>
<script>
(function () {
  "use strict";
  var FILES = ["camera-stream.js", "integrations.js", "app/strings.js", "app/core.js", "app/icons.js", "app/widgets.js", "app/lights.js", "app/lightpanel.js", "app/effects.js", "app/media.js", "app/climate.js", "app/vacuum.js", "app/camera.js", "app/advanced.js", "app/kinds.js", "app/popups.js", "app/model.js", "app/devices.js", "app/status.js", "app/sections.js", "app/rules.js", "app/editor.js", "app/pages.js", "app/header.js", "app/glance.js", "app/pins.js", "app/appearance.js", "app/search.js", "app/store.js", "app/scenes.js", "app/livescenes.js", "app/areas.js", "app/wall.js", "app/backups.js", "app/security.js", "app/conditions.js", "app/access.js", "app/settings.js", "app/pluginapi.js", "app/saved.js", "app/lighteditor.js", "app/scenenew.js", "app/staticmaker.js", "app/vlights.js", "app/livemaker.js", "app/history.js", "app/notifications.js", "app/roomoff.js", "app/remote.js", "app/appliance.js", "app/profiles.js", "app/manage.js", "app/doorcall.js"];
  var query = new URLSearchParams(location.search);
  window.appFile = function (name) {
    return new URL("lights/app/" + name, location.href).href;
  };
  /* The dashboard's refresh loop is main.js, which is not run here: this does what it does for a popup. */
  window.refresh = function () {
    try {
      lpTrackTick();
      runUpdates(LIVE, "live update");
      runUpdates(SLIVE, "live update");
    } catch (e) {
      console.error("[hue-light]", e);
    }
  };

  function load(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src + (query.get("v") ? "?v=" + encodeURIComponent(query.get("v")) : "");
      s.onload = resolve;
      s.onerror = function () {
        reject(new Error("Unable to load " + src));
      };
      document.body.appendChild(s);
    });
  }

  var gotHass;
  var firstHass = new Promise(function (resolve) {
    gotHass = resolve;
  });
  var pending = [];
  var ready = false;
  var HPLAST = {};

  /* A sheet opened over the screen (a light's Style) belongs to that screen: it goes when the screen does, and is not found open over the next one. */
  function shutSheets() {
    try {
      if (typeof SHEET !== "undefined" && SHEET) closeSheet();
    } catch (e) {}
  }

  /* A zoomed Safari measures in zoomed units and styles in unzoomed px: a measured length divided by this is a style's px (1 where they agree). */
  function zoom() {
    var styled = parseFloat(getComputedStyle(document.documentElement).width);
    return styled ? document.documentElement.getBoundingClientRect().width / styled || 1 : 1;
  }

  function body() {
    shutSheets();
    var b = document.getElementById("body");
    /* what a close changed (see leave) is undone */
    b.style.height = b.style.marginTop = b.style.flex = "";
    b.innerHTML = "";
    return b;
  }

  /* ---- A light picked among lights that look the same, as the Hue app does it ----
   The wheel shows one marker for lights that look the same, with their number. Tapping the tile of one of them does not take it out: the marker is picked for that light (its drop shows
   that light's icon, not the number, and brightness, colour and effects act on that light alone). Only dragging the marker then takes that light out, and the others stay where they are.
   Home Control's own code (lights/) is not changed: this wraps its functions in this frame. */
  var HPM = {};
  /* The lights in the order the panel gives them (the room page's row): the tiles follow it, whatever the wheel joins. */
  var HPORDER = [];
  function hpRank(n) {
    var i = HPORDER.indexOf(n.key);
    if (i < 0)
      HPORDER.forEach(function (e, j) {
        if (i < 0 && n.cmd && n.cmd.length && n.cmd[0] === e) i = j;
      });
    return i < 0 ? 1e6 : i;
  }
  function hpPickable(S) {
    window.HPS = S;
    S.focus = null;
    var reveal = S.reveal,
      select = S.select,
      target = S.target;
    function groupOf(n) {
      return S.joined.filter(function (v) {
        return v.kids.indexOf(n) >= 0;
      })[0];
    }
    /* The marker of the group shows the picked light's icon instead of the number while that light is picked. */
    function paintPick() {
      Object.keys(HPM).forEach(function (k) {
        HPM[k] = HPM[k].filter(function (m) {
          return m.pin.isConnected;
        });
        HPM[k].forEach(function (m) {
          paintOne(k, m);
        });
      });
    }
    function paintOne(k, m) {
      var num = m.pin.querySelector(".lw-num"),
          pick = m.pin.querySelector(".hp-pick");
        var mine = S.focus && S.focus.v.key === k && S.sel === k;
        if (mine && !pick && num) {
          num.style.display = "none";
          var ico = document.createElement("span");
          ico.className = "hp-pick";
          ico.innerHTML = svg(S.focus.n.icon || "light");
          m.pin.insertBefore(ico, num);
        } else if (!mine && pick) {
          pick.remove();
          if (num) num.style.display = "";
        }
    }
    S.select = function (key) {
      if (!S.focus || key !== S.focus.v.key || !S.focus.keep) S.focus = null;
      if (S.focus) S.focus.keep = false;
      select(key);
      paintPick();
    };
    S.target = function () {
      return S.focus && S.sel === S.focus.v.key ? S.focus.n : target();
    };
    S.reveal = function (n) {
      var v = groupOf(n);
      if (!v) return reveal(n);
      S.focus = { v: v, n: n, keep: true };
      S.select(v.key);
    };
  }
  /* The markers are made by lpMarker: each is noted by the key of what it stands for, so the group's marker can be found. */
  function hpWrapMarkers() {
    if (window.lpMarker && !window.lpMarker.hp) {
      var made = window.lpMarker;
      window.lpMarker = function (n, showName) {
        var m = made(n, showName);
        /* one marker per circle (the colour and the white circle each have one) */
        (HPM[n.key] = HPM[n.key] || []).push(m);
        return m;
      };
      window.lpMarker.hp = true;
    }
    if (window.lpTrayNodes && !window.lpTrayNodes.hp) {
      var trayNodes = window.lpTrayNodes;
      window.lpTrayNodes = function (S) {
        return trayNodes(S)
          .slice()
          .sort(function (a, b) {
            return hpRank(a) - hpRank(b);
          });
      };
      window.lpTrayNodes.hp = true;
    }
    if (window.eaSelect && !window.eaSelect.hp) {
      var pickArea = window.eaSelect;
      window.eaSelect = function (key) {
        pickArea(key);
        hpOrientPaint();
      };
      window.eaSelect.hp = true;
    }
    if (window.lpTileSel && !window.lpTileSel.hp) {
      var tileSel = window.lpTileSel;
      window.lpTileSel = function (S, n) {
        if (S.focus && S.sel === S.focus.v.key) return n === S.focus.n;
        return tileSel(S, n);
      };
      window.lpTileSel.hp = true;
    }
  }
  /* ---- Orientation setup, as the app has it for a light made of zones (Hue-Screenshots/IMG_0419) ----
   A round button at the end of the tray opens it for the picked light: lying flat or standing up, parallel or perpendicular to the speakers' wall, the cord at the left or the right. The
   choices turn the bar in the editor (its angle around, a, and up, p); Home Control's editor draws it and saves it as it does any change. */
  function hpOrientButton() {
    var tray = document.querySelector(".ae-tray");
    if (!tray || document.querySelector(".hp-orient")) return;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "hp-orient";
    b.setAttribute("aria-label", _T("app_orientation_setup"));
    b.innerHTML = svg("cog");
    b.addEventListener("click", hpOrientSheet);
    tray.parentNode.insertBefore(b, tray.nextSibling);
    hpOrientPaint();
  }
  function hpOrientPaint() {
    var b = document.querySelector(".hp-orient"),
      key = window.EAD && EAD.sel;
    if (b) b.classList.toggle("on", !!(key && eaLightOf(key) && eaIsBar(key)));
  }
  function hpOrientOf(l) {
    var a = ((((l.a || 0) % 360) + 360) % 360) * (Math.PI / 180);
    return {
      up: Math.abs(l.p || 0) >= 45,
      across: Math.abs(Math.sin(a)) > Math.abs(Math.cos(a)),
      right: Math.abs(Math.sin(a)) > Math.abs(Math.cos(a)) ? Math.sin(a) < 0 : Math.cos(a) < 0,
    };
  }
  function hpOrientSet(l, o) {
    l.p = o.up ? 90 : 0;
    l.a = o.across ? (o.right ? 270 : 90) : o.right ? 180 : 0;
  }
  function hpOrientSheet() {
    var key = window.EAD && EAD.sel,
      l = key && eaLightOf(key);
    if (!l || !eaIsBar(key)) return;
    var o = hpOrientOf(l),
      sheet = document.createElement("div");
    sheet.className = "hp-osheet";
    sheet.innerHTML = "<p></p><div class='hp-ogrid'></div>";
    sheet.querySelector("p").textContent = _T("app_orientation_question").replace("{name}", (EAD.v.byId[key] || {}).name || entName(key));
    var grid = sheet.querySelector(".hp-ogrid"),
      was = { a: l.a, p: l.p };
    [
      ["up", false, "app_lying_flat"],
      ["up", true, "app_standing_up"],
      ["across", false, "app_parallel"],
      ["across", true, "app_perpendicular"],
      ["right", false, "app_cord_at_left"],
      ["right", true, "app_cord_at_right"],
    ].forEach(function (c) {
      var t = document.createElement("button");
      t.type = "button";
      t.className = "hp-ochoice";
      t.textContent = _T(c[2]);
      t.dataset.k = c[0];
      t.dataset.v = c[1] ? "1" : "";
      t.addEventListener("click", function () {
        o[c[0]] = c[1];
        hpOrientSet(l, o);
        eaDrawLight(key);
        paint();
      });
      grid.appendChild(t);
    });
    function paint() {
      Array.prototype.forEach.call(grid.children, function (t) {
        t.classList.toggle("on", o[t.dataset.k] === !!t.dataset.v);
      });
    }
    paint();
    /* The page's own bar above the frame becomes this sheet's: its title, X puts the light back as it was, DONE keeps it. */
    var host = window.parent && window.parent.HueHost,
      restore = function () {};
    function shut() {
      restore();
      sheet.remove();
      document.body.classList.remove("orienting");
    }
    if (host && host.frameBar)
      restore = host.frameBar(
        _T("app_orientation_setup"),
        shut,
        function () {
          l.a = was.a;
          l.p = was.p;
          eaDrawLight(key);
          shut();
        }
      );
    document.body.classList.add("orienting");
    document.body.appendChild(sheet);
  }

  /* Pressing the picked group's marker takes the picked light out before the wheel sees the press, so the wheel drags that light alone; a press that does not move puts it back. */
  var hpPress = null;
  document.addEventListener(
    "pointerdown",
    function (e) {
      var S = window.HPS,
        circ = e.target.closest ? e.target.closest(".lw-c") : null;
      hpPress = null;
      if (!S || !circ || !S.focus || S.sel !== S.focus.v.key) return;
      var m = (HPM[S.focus.v.key] || []).filter(function (x) {
        return circ.contains(x.pin);
      })[0];
      if (!m || lpReach(circ, e, m) > 34) return;
      var v = S.focus.v,
        n = S.focus.n,
        before = { ex: Object.assign({}, S.ex), joined: S.joined.slice(), sel: S.sel, focus: S.focus };
      S.focus = null;
      S.detach(v, n);
      var mine = (HPM[n.key] || []).filter(function (x) {
          return circ.contains(x.pin);
        })[0],
        r = circ.getBoundingClientRect();
      if (mine) lpPlace(mine, e.clientX - r.left, e.clientY - r.top);
      hpPress = { x: e.clientX, y: e.clientY, moved: false, before: before };
    },
    true
  );
  document.addEventListener(
    "pointermove",
    function (e) {
      if (hpPress && !hpPress.moved && Math.hypot(e.clientX - hpPress.x, e.clientY - hpPress.y) >= 6) hpPress.moved = true;
    },
    true
  );
  document.addEventListener(
    "pointerup",
    function () {
      var p = hpPress,
        S = window.HPS;
      hpPress = null;
      if (!p || p.moved || !S) return;
      /* A tap: the light goes back into its group, which stays picked for it. */
      setTimeout(function () {
        S.ex = p.before.ex;
        S.joined = p.before.joined;
        S.pop = null;
        S.rebuild();
        p.before.focus.keep = true;
        S.focus = p.before.focus;
        S.select(p.before.sel);
      }, 0);
    },
    true
  );

  /* The panel is the page (the Hue app's colour wheel screen), not a popup: it is drawn straight into the page of this frame, which the panel shows under its own bar. */
  window.HuePopup = {
    /* The panel's `hass`, now and whenever Home Assistant sends a new one. */
    attach: function (hass) {
      gotHass();
      if (!window.HA) {
        pending.push(hass);
        return;
      }
      window.HA.attach(hass);
    },
    isReady: function () {
      return ready;
    },
    /* Draws the colour, white and effects panel of the lights of a room or a scene, with a tile for each. */
    panel: function (ids, name, focus, fromY, scrollX, icons) {
      if (!ready) return false;
      /* Each light is drawn with the icon the panel gives it (from the bridge's icon type), on its tile and in its marker. */
      HPORDER = ids.slice();
      Object.keys(icons || {}).forEach(function (e) {
        LNAME[e] = [A(e).friendly_name || e, icons[e]];
      });
      document.body.classList.remove("areamode");
      var b = body();
      document.body.classList.remove("rise");
      var wasHidden = true;
      /* Always the lights master panel, one screen for every light of the room, as in the app; `focus` is the light whose tile is picked when it opens. */
      LMASTER.hue = ids;
      LMASTER_NAME.hue = name;
      LMASTER_ALL.hue = true;
      LWHEEL["m:hue"] = undefined;
      lightPanel(b, lpMasterNode("hue", ids), {
        room: null,
        sliders: false,
        ready: function (S) {
          /* A tile for every light, always; the markers on the wheel are joined where lights look the same (an off light looks as it was last set). */
          var root = S.root;
          if (root.kids) {
            S.ex[root.key] = true;
            S.joined.length = 0;
            /* The tiles are in the order of the room page's row (the order the panel gives the lights in), so each slides to its own place. */
            var names = ids.map(function (e) {
              return A(e).friendly_name || e;
            });
            var rank = function (k) {
              var i = ids.indexOf(k.key);
              if (i < 0) i = names.indexOf(k.name);
              return i < 0 ? 1e6 : i;
            };
            root.kids.sort(function (a, b) {
              return rank(a) - rank(b) || String(a.name || "").localeCompare(String(b.name || ""));
            });
            var groups = [];
            root.kids.forEach(function (k) {
              var look = lpNodeLook(k),
                g = look
                  ? groups.filter(function (x) {
                      return x.look && lpSameLook(x.look, look);
                    })[0]
                  : null;
              if (g) g.kids.push(k);
              else groups.push({ look: look, kids: [k] });
            });
            groups.forEach(function (g) {
              if (g.kids.length > 1) S.joined.push(S.makeVirtual(g.kids, g.kids[0].icon));
            });
            S.rebuild();
          }
          hpPickable(S);
          if (focus && ids.indexOf(focus) >= 0) {
            var fn = lpFindIn(S, focus);
            if (fn) S.reveal(fn);
            else S.select(focus);
          }
        },
      });
      window.refresh();
      /* The app opens this screen out of the room page: the row of lights slides down to the bottom while the wheel and its controls come in. */
      var tray = b.querySelector(".lp-tray");
      if (tray && typeof scrollX === "number") tray.scrollLeft = scrollX;
      if (tray && typeof fromY === "number") {
        var shift = fromY - tray.getBoundingClientRect().top / zoom();
        tray.style.transition = "none";
        tray.style.transform = "translateY(" + shift + "px)";
        void tray.offsetHeight;
        tray.style.transition = "transform .42s cubic-bezier(.2,.8,.2,1)";
        tray.style.transform = "none";
      }
      document.body.classList.add("rise");
      return wasHidden;
    },
    /* What the bridge says each light was last set to (a list from get_resources "lights"), so that lights that are off are placed on the wheel, and grouped, by their last settings as the app does. */
    seed: function (list) {
      var byHue = {};
      (list || []).forEach(function (l) {
        byHue[l.id] = l;
      });
      Object.keys(H().states).forEach(function (e) {
        var l = e.indexOf("light.") === 0 && byHue[A(e).hue_light_id];
        if (!l) return;
        var o = { b: l.brightness == null ? null : l.brightness };
        if (l.mirek) {
          o.k = Math.round(1000000 / l.mirek);
          o.mode = "color_temp";
        } else if (l.xy) {
          o.xy = l.xy;
          o.mode = "xy";
        }
        HPLAST[e] = o;
        var mem = LPMEM[e] || (LPMEM[e] = {});
        if (o.xy) mem.hs = liveXyHs(o.xy[0], o.xy[1]) || mem.hs;
        if (o.k) mem.k = o.k;
      });
    },
    /* Home Control's area editor (the room in three dimensions, the lights to drag, their tray), on an area of the bridge, drawn as the Hue app draws it: area is {id, name, lights: [{light_id, x, y, z, balance}]}. */
    area: function (area) {
      if (!ready) return false;
      var draft = window.HuePlusFrame.draft(area);
      window.EAD = { room: "", isNew: false, sel: null, draft: draft, saved: JSON.stringify(draft), external: { plugin: "hue_plus", id: area.id, after: null, note: "" } };
      document.body.classList.add("areamode");
      eaEditor(body());
      hpOrientButton();
      document.body.classList.add("rise");
      return true;
    },
    /* What the editor holds now (name, the lights that are Hue Plus lights with their places, the others as they were), as JSON. The light it was showing is put back. */
    areaDraft: function () {
      var d = window.EAD && window.EAD.draft;
      try {
        eaIdentifyOff();
      } catch (e) {}
      return d ? JSON.stringify(d) : null;
    },
    /* Closing the colour screen is its opening run backwards (same distances, same time, the mirrored curve): the wheel and the buttons go up out of the top, the tiles go up to where the room page has them (toY, the top of that row), then done(). */
    leave: function (toY, done, lift, ms) {
      /* Closing, as the Hue app does it (measured frame by frame in the owner's screen recording at 60 fps): about a quarter of a second; the wheel starts slowly and gathers speed until it
         has left past the top of the screen; the mode and brightness buttons go up with it and fade at the very end; the row of lights reaches the room page's row by six tenths of the time;
         the dark background stays until half way (the page does that part). `lift` is how far below the top of the screen this frame starts: the frame is made as high as the screen for the
         close, so the wheel is not cut off at its top edge, and what is in it is moved down by as much, so nothing jumps. */
      var view = document.querySelector(".lp-view"),
        bar = document.querySelector(".lp-bar"),
        tray = document.querySelector(".lp-tray"),
        b = document.getElementById("body"),
        T = ms || 260,
        z = zoom();
      shutSheets();
      document.body.classList.remove("rise");
      document.body.style.opacity = "1";
      /* the tile that was picked is a plain tile again as it goes back into the room's row */
      Array.prototype.forEach.call(document.querySelectorAll(".lp-tile.picked"), function (t) {
        t.classList.remove("picked");
      });
      if (b && lift) {
        b.style.height = b.offsetHeight + "px";
        b.style.marginTop = lift + "px";
        b.style.flex = "none";
      }
      /* The wheel's way out: where it is at each moment, as a share of the whole way (read from the recording; linear between the samples). */
      var path = [
        [0, 0],
        [0.27, 0.07],
        [0.4, 0.1],
        [0.47, 0.17],
        [0.53, 0.25],
        [0.6, 0.31],
        [0.67, 0.39],
        [0.73, 0.47],
        [0.8, 0.55],
        [0.87, 0.64],
        [0.93, 0.78],
        [1, 1],
      ];
      function out(el, far, fade) {
        if (!el) return;
        el.style.animation = "none";
        el.style.transition = "none";
        el.animate(
          path.map(function (p) {
            var k = { offset: p[0], transform: "translateY(" + -far * p[1] + "px)" };
            if (fade) k.opacity = p[0] < 0.8 ? 1 : Math.max(0, 1 - (p[0] - 0.8) / 0.15);
            return k;
          }),
          { duration: T, easing: "linear", fill: "forwards" }
        );
      }
      /* far enough that the wheel is above the top of the screen at the end */
      var far = view ? view.getBoundingClientRect().bottom / z + (lift || 0) + 12 : 0;
      out(view, far, false);
      out(bar, far, true);
      if (tray && typeof toY === "number") {
        tray.style.transition = "none";
        tray.animate([{ transform: "none" }, { transform: "translateY(" + (toY - tray.getBoundingClientRect().top / z) + "px)" }], {
          duration: T * 0.6,
          easing: "cubic-bezier(.6,0,.4,1)",
          fill: "forwards",
        });
      }
      setTimeout(done, T + 16);
    },
    /* How far the row of lights is scrolled sideways, so the room page's row can be put at the same place. */
    trayScroll: function () {
      var tray = document.querySelector(".lp-tray");
      return tray ? tray.scrollLeft : 0;
    },
    /* Takes the screen away before another is drawn, so what was there is not seen again. */
    hide: function () {
      document.body.classList.remove("rise");
    },
    clear: function () {
      try {
        eaIdentifyOff();
      } catch (e) {}
      document.body.classList.remove("areamode");
      body();
    },
    /* What the lights are doing now, so that what a change did to them can be undone, and what a scene should make each of them do. */
    snapshot: function (ids) {
      return JSON.stringify(lightSnapshot(ids));
    },
    restore: function (snapshot) {
      lightRestore(JSON.parse(snapshot));
    },
    acts: function (ids) {
      return lightUnits(ids).map(lightAct);
    },
  };

  function start() {
    return load("lights/ha-adapter.js")
      .then(function () {
        pending.splice(0).forEach(function (hass) {
          window.HA.attach(hass);
        });
        return firstHass;
      })
      .then(function () {
        return window.HA.ready();
      })
      .then(function () {
        /* Home Control's files come in one answer (lights/bundle.json, built from FILES by scripts/build_menu.py) and each is run as a script of its own, in order, as if it had been asked for by itself. */
        return fetch("lights/bundle.json" + (query.get("v") ? "?v=" + encodeURIComponent(query.get("v")) : ""))
          .then(function (r) {
            if (!r.ok) throw new Error("Unable to load lights/bundle.json");
            return r.json();
          })
          .then(function (files) {
            files.forEach(function (f) {
              var s = document.createElement("script");
              s.textContent = f[1] + "\n//# sourceURL=lights/" + f[0];
              document.body.appendChild(s);
            });
          });
      })
      .then(function () {
        /* What main.js sets up, without anything being kept in Home Assistant: the Hue panel is a window onto the bridge, so what Home Control's dashboard saves in Home Assistant (its layout, the
           theme, saved colours) is not read and not written here, and the saved-colours rows of the light popup are left out. */
        UI = { on: {}, caps: {}, rooms: [], devs: {}, layout: { home: [], rooms: {}, cols: {} }, meta: {} };
        ISADMIN = true;
        STORE_READY = true;
        var nothing = function () {
          return Promise.resolve(null);
        };
        window.HA.data = { get: nothing, set: nothing, subscribe: nothing, unsubscribe: nothing };
        /* The effects page lists what Hue Plus has worked out for its lights (their pictures, speeds, default and other colours), as Home Control gets it from the plus integration. */
        window.HA.effects = {
          sources: function () {
            return fetch(new URL("effects.json", location.href).href + (query.get("v") ? "?v=" + encodeURIComponent(query.get("v")) : ""))
              .then(function (r) {
                return r.json();
              })
              .then(function (source) {
                return [source];
              });
          },
        };
        /* What Home Control keeps for this browser (its large display, its theme, what it last showed) is Home Control's: the Hue panel shares its address, so it would read it, and must not. */
        window.deviceGet = function (key, fallback) {
          return fallback;
        };
        window.deviceSet = function () {};
        LG = false;
        applyLG();
        hpWrapMarkers();
        window.lightScenesRow = function () {};
        var lookOn = window.lpLook;
        window.lpLook = function (e) {
          if (isOn(e)) return lookOn(e);
          var m = HPLAST[e];
          return m ? { b: m.b, xy: m.xy || null, k: m.k || null, mode: m.mode } : { off: true };
        };
        window.savedRoomOf = function () {
          return null;
        };
        window.HA.onUpdate(function () {
          window.refresh();
        });
        setInterval(window.refresh, 1500);
      })
      .then(function () {
        window.BOOTED = true;
        return load("menu.js");
      })
      .then(function () {
        return new Promise(function (resolve) {
          fxLoad(resolve);
        });
      })
      .then(function () {
        ready = true;
      })
      .catch(function (e) {
        console.error("[hue-light]", e);
      });
  }

  start();
})();
</script>
