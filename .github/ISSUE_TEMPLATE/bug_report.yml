name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Philips Hue Plus, Home Assistant core, and the bridge or device firmware"
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Remove tokens and keys first.
      render: text
